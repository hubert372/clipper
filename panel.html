<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Clipper</title>
<style>
:root{--ink:#111111;--panel:#161618;--panel2:#1c1c1f;--edge:rgba(255,255,255,.1);--text:#ffffff;--sub:#9a9aa0;--fill:rgba(255,255,255,.06);
--cyan:#FF6207;--acc2:#FB7F2F;--tint:rgba(255,98,7,.1);--mint:#10B981;--hot:#EF4444;--amber:#F59E0B;--violet:#9a9aa0;--glass:rgba(17,17,17,.72);
--ease:cubic-bezier(.16,1,.3,1);--head:"Inter","Plus Jakarta Sans","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;--body:var(--head)}
:root[data-theme=light]{--ink:#ffffff;--panel:#F5F5F7;--panel2:#ffffff;--edge:rgba(37,37,37,.09);--text:#252525;--sub:#666666;--fill:rgba(37,37,37,.05);--glass:rgba(255,255,255,.78)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.5 var(--body);background:var(--ink);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
nav{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;padding:10px 22px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--edge)}
.brand{font:800 20px/1 var(--head);letter-spacing:-.035em;display:flex;align-items:center;gap:9px;flex:none}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(180deg,#FF6207,#FB7F2F)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
nav button{all:unset;cursor:pointer;padding:7px 11px;border-radius:9999px;font:600 14px var(--head);color:var(--sub);white-space:nowrap;transition:color .15s var(--ease),background .15s var(--ease);display:flex;align-items:center;gap:6px}
nav button:hover{color:var(--text);background:var(--fill)}
nav button.on{color:var(--cyan);background:var(--tint)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.thumb:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
nav .n{font-size:11px;color:#fff;background:var(--cyan);border-radius:9999px;padding:0 7px;font-weight:700;font-variant-numeric:tabular-nums}
.status{display:flex;align-items:center;gap:8px;flex:none;font-size:13px}
.chip{padding:4px 11px;border-radius:9999px;border:1px solid var(--edge);color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{color:var(--mint);border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.1)}
.foot{position:fixed;left:16px;bottom:14px;z-index:3;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--edge);border-radius:9999px;padding:5px 6px 5px 14px}
main{overflow:auto;padding:30px 34px 90px;flex:1}
main>*{max-width:1320px;margin-left:auto;margin-right:auto}
h1{font:800 34px/1.1 var(--head);letter-spacing:-.035em;margin-bottom:6px}
h2{font:700 18px/1.2 var(--head);letter-spacing:-.02em;margin:26px auto 10px}
.lead{color:var(--sub);margin-bottom:22px}.lead,.sub{max-width:none}p.lead{max-width:1320px}
.sub{color:var(--sub);font-size:13px}
.num,b.num,.tile b,.badge,.tag{font-variant-numeric:tabular-nums}
.num{font-family:var(--head);font-weight:800;letter-spacing:-.02em}
.card{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:20px;padding:18px;transition:border-color .2s var(--ease)}
.card:hover{border-color:rgba(255,98,7,.4)}
.card .card{border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
button.b,a.b{font:600 14px var(--head);border:1px solid var(--edge);background:transparent;color:var(--text);padding:8px 16px;cursor:pointer;border-radius:9999px;
transition:transform .15s var(--ease),box-shadow .2s var(--ease),border-color .15s var(--ease),background .15s var(--ease);display:inline-block;white-space:nowrap}
button.b:hover,a.b:hover{border-color:rgba(255,98,7,.5);transform:translateY(-1px)}
button.b:active,a.b:active{transform:scale(.97)}
button.b.go,a.b.go{background:linear-gradient(180deg,#FF6207 0%,#FB7F2F 100%);color:#fff;border-color:transparent}
button.b.go:hover{box-shadow:0 6px 20px rgba(255,98,7,.35)}
button.b.bad{color:var(--hot)}button.b:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--fill);border:1px solid var(--edge);padding:8px 12px;min-width:0;border-radius:12px}
select option{background:#161618;color:#fff}
input[type=color]{padding:2px;width:46px;height:34px}input[type=range]{padding:0;border:0;background:none;accent-color:var(--cyan);width:100%}
input[type=checkbox]{accent-color:var(--cyan)}
.name{font:700 17px var(--head);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--sub);opacity:.6;flex:none}
.dot.live{background:var(--hot);opacity:1;box-shadow:0 0 0 4px rgba(239,68,68,.18);animation:pulse 1.4s infinite}.dot.waiting{background:var(--amber);opacity:1}.dot.paused{background:var(--sub)}
@keyframes pulse{50%{opacity:.4}}
.chart{position:relative;height:64px;display:flex;align-items:flex-end;gap:2px;margin:14px 0 10px}
.chart.tall{height:150px}
.chart i{flex:1;background:var(--fill);border-radius:3px 3px 0 0;min-height:2px;border-top:2px solid rgba(255,98,7,.55)}
.chart i.hot{background:linear-gradient(180deg,#FF6207,#FB7F2F);border-top-color:#FF6207}
.chart .thr{position:absolute;left:0;right:0;border-top:1px dashed var(--sub);opacity:.7}
.sw{position:relative;width:44px;height:26px;border:1px solid var(--edge);background:var(--fill);cursor:pointer;padding:0;flex:none;border-radius:9999px;transition:background .2s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--sub);transition:transform .2s var(--ease),background .2s}
.sw.on{background:linear-gradient(180deg,#FF6207,#FB7F2F);border-color:transparent}.sw.on::after{transform:translateX(18px);background:#fff}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.clip{padding:0;overflow:hidden}.clip video,.clip .ph{display:block;width:100%;aspect-ratio:9/16;background:#000;object-fit:cover}
.clip .ph{display:flex;align-items:center;justify-content:center;color:#9a9aa0;font-size:13px;text-align:center;padding:14px}
.clip .meta{padding:12px 14px 14px}.clip .t{font:700 14px var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.badge{position:absolute!important;top:10px;left:10px;font:800 14px var(--head);padding:3px 11px;border-radius:9999px;background:rgba(17,17,17,.82);backdrop-filter:blur(6px);border:1px solid currentColor}
.good{color:var(--mint)}.mid{color:var(--cyan)}.low{color:var(--hot)}
.link{all:unset;cursor:pointer;color:var(--cyan);font-size:13px;font-weight:600}.link:hover{text-decoration:underline}.link.bad{color:var(--hot)}
.empty{color:var(--sub);padding:44px 0;text-align:center;grid-column:1/-1}
.warn{border-color:rgba(245,158,11,.5);color:var(--amber);margin-bottom:16px;font-size:14px}
.log{font:12px/1.7 "Cascadia Code",Consolas,ui-monospace,monospace;color:var(--sub);max-height:200px;overflow:auto;white-space:pre-wrap}
.split{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;align-items:start}
.list button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;width:100%;box-sizing:border-box;border-radius:12px}
.list button:hover{background:var(--fill)}.list button.on{background:var(--tint)}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none;font:800 38px var(--head)}
.ring span{width:96px;height:96px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.part{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar{height:8px;background:var(--fill);border-radius:9999px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,#FF6207,#FB7F2F);border-radius:9999px}
ul.tips{padding-left:18px;margin:6px 0}ul.tips li{margin:5px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
.tile b{display:block;font:800 32px/1.1 var(--head);letter-spacing:-.035em}
.hbar{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--edge)}
.field:first-of-type{border-top:0}.field input[type=number]{width:90px;text-align:right}.field input[type=text],.field input[type=password]{width:min(300px,50vw)}
.words{display:flex;flex-wrap:wrap;gap:5px}.words input{width:auto;padding:4px 8px;font-size:13px;border-radius:8px}.words input.out{opacity:.4}
.words input.cutw{text-decoration:line-through;color:var(--hot);border-color:var(--hot)}
dialog{margin:auto;border:1px solid var(--edge);border-radius:24px;background:var(--panel);color:var(--text);padding:22px;width:min(540px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:9999px;background:var(--tint);color:var(--cyan)}.tag.ok{background:rgba(16,185,129,.12);color:var(--mint)}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.styles button{all:unset;cursor:pointer;border:2px solid var(--edge);border-radius:12px;overflow:hidden;background:#0b111e;display:block;color:#fff;transition:border-color .15s var(--ease)}
.styles button.on{border-color:var(--cyan);box-shadow:0 6px 20px rgba(255,98,7,.25)}
.styles img{display:block;width:100%;aspect-ratio:9/16;background:#0b111e;object-fit:cover}
.styles span{display:block;padding:7px 10px;font:600 14px var(--head)}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.themes button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--edge);border-radius:9999px;font-size:13px}
.themes button:hover{background:var(--fill)}.themes i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}
video:fullscreen{object-fit:contain!important;aspect-ratio:auto!important;background:#000}
.thumb{position:relative;cursor:pointer}.thumb .play{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:#fff;background:rgba(0,0,0,.28);opacity:0;transition:opacity .15s var(--ease)}
.thumb:hover .play,.thumb:focus-visible .play{opacity:1}
#clipdlg{width:min(980px,96vw);padding:18px}
.viewer{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:20px;align-items:start}
.viewer video{width:100%;max-height:80vh;aspect-ratio:9/16;background:#000;object-fit:contain;border-radius:12px}
.vwrap{position:relative}.ui{position:absolute;inset:0;pointer-events:none}
.ui div{position:absolute;background:rgba(255,98,7,.3);border:1px dashed var(--cyan);font-size:11px;color:#fff;display:grid;place-items:center}
.pubrow{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--edge)}
.pubrow textarea{width:100%;min-height:62px;resize:vertical;font-size:13px}
.pubrow .ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-size:12px;color:var(--sub)}
.pubrow input[type=number]{width:96px;text-align:right}
.cpick{position:relative}
.cbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border:1px solid var(--edge);border-radius:9999px;font:600 13px var(--head);max-width:230px}
.cbtn:hover{border-color:rgba(255,98,7,.5)}.cbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 13px var(--head);color:#fff;flex:none}
.cnt{min-width:24px;height:24px;padding:0 7px;border-radius:9999px;background:var(--fill);border:1px solid var(--edge);display:grid;place-items:center;font:700 12px var(--head);font-variant-numeric:tabular-nums;flex:none}
.cnt.hot{background:var(--tint);color:var(--cyan);border-color:transparent}
.cmenu{position:absolute;right:0;top:calc(100% + 10px);width:340px;background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:6px;z-index:6;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:up .18s var(--ease) both}
.cmenu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;width:100%;box-sizing:border-box}
.cmenu button:hover{background:var(--fill)}
.cmenu .t{font:700 14px var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmenu .need{font-size:12px;font-weight:600;color:var(--cyan)}.cmenu .need.zero{color:var(--sub)}
.cmenu .lab{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--sub);padding:10px 12px 4px}
.cmenu hr{border:0;border-top:1px solid var(--edge);margin:6px 0}
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--edge)}.todo:first-of-type{border-top:0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;grid-column:1/-1}
.steps .card b{display:block;font:800 26px var(--head);color:var(--cyan);letter-spacing:-.035em;margin-bottom:8px}
.toast{position:fixed;right:22px;bottom:22px;z-index:5;background:var(--panel);border:1px solid rgba(255,98,7,.5);border-radius:9999px;padding:10px 18px;opacity:0;transform:translateY(8px);transition:.25s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:none}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes fill{from{transform:scaleX(0)}}
.reveal .card,.reveal .tile{animation:up .25s var(--ease) both}
.reveal .bar b{animation:fill .7s var(--ease) both;transform-origin:left}
.reveal .card:nth-child(2){animation-delay:50ms}.reveal .card:nth-child(3){animation-delay:100ms}.reveal .card:nth-child(4){animation-delay:150ms}
.reveal .card:nth-child(5){animation-delay:200ms}.reveal .card:nth-child(6){animation-delay:250ms}.reveal .card:nth-child(n+7){animation-delay:300ms}
@media(max-width:1700px){.status .chip:not(.ok){display:none}nav{gap:10px;padding:10px 16px}}
@media(max-width:860px){nav{flex-wrap:wrap;padding:8px 12px}.status .chip:not(.ok){display:none}main{padding:20px 14px 90px}.split,.viewer{grid-template-columns:1fr}.viewer video{max-height:56vh}
.pubrow{grid-template-columns:1fr}.pubrow .ctl{align-items:flex-start}h1{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div class="foot" id="foot"></div>
<dialog id="chdlg"></dialog>
<dialog id="clipdlg"></dialog>
<dialog id="campdlg"></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved = ''; try { saved = localStorage.getItem('clipper_view') || ''; } catch {}
let S = null, view = ['channels','monitor','clips','rating','editor','publish','campaigns','insights','stats','settings'].find(v => v === (location.hash.slice(1) || saved)) || 'home', sel = null, sig = '', known = null, filt = {ch: '', sort: 'best', rev: ''}, aiBusy = false, addAI = false;
const VIEWS = [['home', 'Start'], ['channels', 'Kanały'], ['monitor', 'Monitor'], ['clips', 'Klipy'], ['rating', 'Ocena'], ['editor', 'Edytor'], ['publish', 'Publikacja'], ['campaigns', 'Kampanie'], ['insights', 'Wnioski'], ['stats', 'Statystyki'], ['settings', 'Ustawienia']];

async function post(path, body, quiet) {
  let j = {};
  try { j = await (await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})).json(); }
  catch { j = {error: 'Brak połączenia z aplikacją'}; }
  if (j.error && !quiet) toast(j.error);
  await refresh(true);
  return j;
}
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3200); }
function beep() { try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination);
  o.frequency.setValueAtTime(660, a.currentTime); o.frequency.setValueAtTime(990, a.currentTime + .12); g.gain.setValueAtTime(.12, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .4); o.start(); o.stop(a.currentTime + .4); } catch {} }
const dur = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };
const when = t => new Date(t * 1000).toLocaleString('pl-PL', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
const curCamp = () => S.campaigns.find(c => c.id === S.settings.campaign);
const inCamp = c => !S.settings.campaign || (c.camp && c.camp.id === S.settings.campaign);
const ready = () => S.clips.filter(c => c.status === 'ready' && inCamp(c));
async function setCamp(id) { S.settings.campaign = id; await post('/api/settings', {campaign: id}); sig = ''; draw(true); reveal(); }
function campBar() {
  const c = curCamp(); if (!c) return '';
  const x = (S.camp_stats || {})[c.id] || {clips: 0, views: 0, posted: 0};
  return `<div class="card" style="margin-bottom:18px;border-color:rgba(255,98,7,.4)"><div class="row wrap"><span class="sub">Pracujesz na kampanii</span><div class="name">${esc(c.title)}</div>
      <span class="tag">${c.rate ? '$' + (+c.rate).toFixed(2) + ' / 1K' : c.pool ? 'pula $' + Math.round(c.pool).toLocaleString('pl-PL') : 'bez stawki'}</span><span class="grow"></span>
      ${c.url ? `<a class="b" style="text-decoration:none" href="${esc(c.url)}" target="_blank" rel="noopener">Otwórz kampanię</a>` : ''}
      <button class="b" onclick="editCamp(curCamp())">Edytuj zasady</button><button class="link" onclick="setCamp('')">Pokaż wszystkie</button></div>
    <div class="row wrap sub" style="gap:18px;margin-top:10px"><span><b class="num" style="color:var(--text)">${x.clips}</b> klipów, ${x.posted} wrzuconych</span>
      <span><b class="num" style="color:var(--text)">${x.views.toLocaleString('pl-PL')}</b> wyświetleń${c.min_views ? ' z wymaganych ' + c.min_views.toLocaleString('pl-PL') : ''}</span>
      ${x.est != null ? `<span><b class="num" style="color:var(--mint)">$${x.est.toFixed(2)}</b> szacowanego zarobku</span>` : ''}
      ${c.name ? `<span>Nazwa w tekście: <b style="color:var(--text)">${esc(c.name)}</b></span>` : ''}${c.tags ? `<span>Hashtagi: <b style="color:var(--text)">${esc(c.tags)}</b></span>` : ''}
      <span>Język: <b style="color:var(--text)">${esc(c.lang || 'en')}</b></span><span>Kanały: <b style="color:var(--text)">${esc(c.channels.join(', ') || 'brak')}</b></span></div>
    ${c.min_views ? `<div class="bar" style="margin-top:10px"><b style="width:${Math.min(100, x.views / c.min_views * 100)}%"></b></div>` : ''}
    ${c.rules ? `<details style="margin-top:10px" ${view === 'publish' ? 'open' : ''}><summary class="link">Wymagania i zakazy</summary><div class="sub" style="white-space:pre-wrap;margin-top:6px;color:var(--text)">${esc(c.rules)}</div></details>` : ''}</div>`;
}
const cls = n => n >= 75 ? 'good' : n >= 50 ? 'mid' : 'low';
const total = c => c.score ? c.score.total : null;
const src = c => '/clips/' + encodeURIComponent(c.file || '') + '?v=' + (c.rev || 0);
const clip = id => S.clips.find(c => c.id === id);

function reveal() { const m = $('view'); m.classList.remove('reveal'); void m.offsetWidth; m.classList.add('reveal'); clearTimeout(reveal.t); reveal.t = setTimeout(() => m.classList.remove('reveal'), 900); }
function go(v, id) { setTimeout(reveal); view = v; try { localStorage.setItem('clipper_view', v); } catch {} if (id) sel = id; sig = ''; drawNav(); draw(true); $('view').scrollTop = 0; }
let updating = '';
async function checkUpdate() {
  updating = 'Sprawdzam…'; drawNav();
  const r = await post('/api/update', {}, true);
  if (r.error) { updating = ''; drawNav(); return toast(r.error); }
  if (!r.updated) { updating = ''; drawNav(); return toast('Masz najnowszą wersję'); }
  updating = 'Instaluję…'; drawNav(); toast('Pobrano aktualizację. Clipper uruchomi się ponownie.');
  const wait = setInterval(async () => { try { const s = await (await fetch('/api/state')).json(); if (s.version !== S.version) { clearInterval(wait); location.reload(); } } catch {} }, 1500);
}
/* ---------- co wymaga uwagi ---------- */
const PLAT_N = {shorts: 'Shorts', tiktok: 'TikTok', reels: 'Reels'};
function needs(cid) {       // cid: id kampanii, '' = wszystko
  const out = {submit: [], review: [], post: [], views: []};
  S.clips.forEach(c => { if (c.status !== 'ready' || c.kind === 'montage' || (cid && !(c.camp && c.camp.id === cid))) return;
    const pub = c.pub || {}, done = Object.keys(PLAT_N).filter(k => (pub[k] || {}).done);
    if (c.review !== 'ok') return out.review.push({c});
    if (!done.length) out.post.push({c});
    done.forEach(k => { const p = pub[k];
      if (c.camp && !p.sub) out.submit.push({c, k, left: Math.ceil((1800 - (S.now - (p.done_at || S.now))) / 60)});
      if (!p.views && S.now - (p.done_at || S.now) > 86400) out.views.push({c, k}); }); });
  out.submit.sort((a, b) => a.left - b.left); out.review.sort((a, b) => (b.c.pot ?? 0) - (a.c.pot ?? 0)); out.post.sort((a, b) => (b.c.pot ?? 0) - (a.c.pot ?? 0));
  out.total = out.submit.length + out.review.length + out.post.length + out.views.length;
  return out;
}
const hue = t => { let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 62% 42%)`; };
const ico = t => `<span class="ico" style="background:${hue(t)}">${esc((t.replace(/[^\p{L}\p{N}]/gu, '')[0] || '?').toUpperCase())}</span>`;

function campButton() { const c = curCamp(), n = needs(c ? c.id : '').total;
  return `<button class="cbtn" aria-haspopup="true" aria-expanded="${menuOpen}" onclick="event.stopPropagation();menuOpen=!menuOpen;drawNav()">${c ? ico(c.title) : '<span class="ico" style="background:var(--fill);color:var(--text)">▦</span>'}
    <span>${esc(c ? c.title : 'Wszystkie kampanie')}</span><b class="cnt ${n ? 'hot' : ''}">${n}</b></button>`; }
function campMenu() { const all = needs('').total, row = (id, icon, title, n, on) => `<button onclick="menuOpen=false;setCamp('${id}')">${icon}<span class="grow" style="min-width:0"><div class="t">${esc(title)}</div>
    <div class="need ${n ? '' : 'zero'}">${n ? n + ' wymaga uwagi' : 'wszystko zrobione'}</div></span><b class="cnt">${n}</b><span style="width:16px;color:var(--cyan)">${on ? '✓' : ''}</span></button>`;
  return `<div class="cmenu" onclick="event.stopPropagation()">${row('', '<span class="ico" style="background:var(--fill);color:var(--text)">▦</span>', 'Wszystkie kampanie', all, !S.settings.campaign)}
    <div class="lab">KAMPANIE · ${S.campaigns.length}</div>${S.campaigns.map(c => row(c.id, ico(c.title), c.title, needs(c.id).total, c.id === S.settings.campaign)).join('')}
    <hr><button onclick="menuOpen=false;go('campaigns')"><span class="ico" style="background:none;border:1px dashed var(--sub);color:var(--text)">+</span><span class="t" style="flex:none">Nowa kampania</span><span class="grow"></span>

function sync(a, b, depth) {
  const ac = [...a.children], bc = [...b.children];
  if (ac.length !== bc.length || hasText(a) || hasText(b)) { a.innerHTML = b.innerHTML; return; }
  ac.forEach((x, i) => { const y = bc[i];
    if (norm(x.outerHTML) === norm(y.outerHTML)) return;
    if (depth < 6 && x.children.length && y.children.length && !['VIDEO', 'SELECT', 'TEXTAREA', 'svg'].includes(x.tagName)

}

    [[.12, .9, 0], [-.2, .98, -.25], [-.45, 1.1, -.3], [-.6, 1.14, -.32]], [[.08, 1.0, .02], [.3, 1.1, .25], [.48, 1.2, .3], [.58, 1.24, .3]]];
  arms.forEach(a => tube(a[0], a[1], a[2], a[3], .045, .015, 150));
  // korona: plaskie "chmury" lisci
  [[-1.0, .68, .1, .42, .2, .34, 620], [.98, .9, -.1, .4, .19, .32, 580], [-.62, 1.16, -.32, .36, .18, .3, 480], [.6, 1.26, .3, .34, .17, .28, 440],
   [.02, 1.52, -.02, .5, .26, .4, 820], [-.3, .98, .25, .26, .13, .22, 260]].forEach(a => pad(...a));
  const N = P.length / 4;
  let W, H, ry = .5, rx = .12, ty = .5, tx = .12, raf = 0;
  function size() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); paint(); }
  function paint() {
    g.clearRect(0, 0, W, H);
    const sc = Math.min(W, H) * .4, ox = W * (W > 760 ? .58 : .5), oy = H * .8, cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
    for (let i = 0; i < N; i++) { const x = P[i * 4], y = P[i * 4 + 1] - .7, z = P[i * 4 + 2], w = P[i * 4 + 3];
      const X = x * cy + z * sy, Z = -x * sy + z * cy, Y = y * cx - Z * sx, Z2 = y * sx + Z * cx, f = 3.2 / (3.2 + Z2), d = (1.3 - Z2) / 2.6;
      g.fillStyle = `rgba(${document.documentElement.dataset.theme === 'light' ? '37,37,37' : '255,255,255'},${(.12 + d * .5) * w})`; const r = (1 + d * 1.6) * f;
      g.fillRect(ox + X * sc * f - r / 2, oy - (Y + .7) * sc * f - r / 2, r, r); }
  }
  function loop() { ry += (ty - ry) * .07; rx += (tx - rx) * .07; paint(); raf = Math.abs(ty - ry) + Math.abs(tx - rx) > .001 ? requestAnimationFrame(loop) : 0; }
  window.bgPaint = paint;
  addEventListener('resize', size);
  addEventListener('pointermove', e => { ty = (e.clientX / W - .5) * 3.2; tx = .12 + (e.clientY / H - .5) * .5; if (!raf) raf = requestAnimationFrame(loop); });
  size();
})();
