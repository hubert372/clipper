<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper</title>
<style>
:root{--ink:#070b14;--panel:rgba(14,21,36,.64);--edge:rgba(88,230,255,.16);--text:#dfe9f7;--sub:#7f8da8;
--cyan:#58e6ff;--violet:#8f7bff;--hot:#ff4d9d;--mint:#7dffb0;--amber:#ffc65c;--fill:rgba(127,141,168,.14);
--head:"Bahnschrift","DIN Alternate","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
--body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 var(--body);background:var(--ink);color:var(--text);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.app{position:relative;z-index:1;display:grid;grid-template-columns:212px 1fr;height:100%}
nav{padding:22px 14px;border-right:1px solid var(--edge);background:rgba(7,11,20,.72);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:4px}
.brand{font:700 25px/1 var(--head);letter-spacing:.5px;padding:4px 10px 18px;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:22px;border-radius:3px;background:linear-gradient(160deg,var(--cyan),var(--violet));box-shadow:0 0 16px var(--cyan)}
nav button{all:unset;cursor:pointer;padding:10px 12px;font:500 15px var(--head);letter-spacing:.3px;color:var(--sub);border-left:2px solid transparent;
transition:color .15s,background .15s;display:flex;justify-content:space-between;align-items:center}
nav button:hover{color:var(--text);background:var(--fill)}
nav button.on{color:var(--cyan);border-left-color:var(--cyan);background:linear-gradient(90deg,rgba(88,230,255,.12),transparent)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
nav .n{font-size:12px;color:var(--ink);background:var(--cyan);border-radius:9px;padding:0 7px;font-weight:700}
nav .foot{margin-top:auto;font-size:12px;color:var(--sub);padding:10px 4px 0;line-height:1.6}
main{overflow:auto;padding:26px 30px 60px}
h1{font:700 30px/1.1 var(--head);letter-spacing:.4px;margin-bottom:4px}
h2{font:600 17px var(--head);letter-spacing:.3px;margin:26px 0 10px}
.lead{color:var(--sub);margin-bottom:20px;max-width:70ch}
.sub{color:var(--sub);font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--head)}
.card{position:relative;background:var(--panel);border:1px solid var(--edge);padding:16px;backdrop-filter:blur(8px);
clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(88,230,255,.16),transparent 65%)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
button.b,a.b{font:600 14px var(--head);letter-spacing:.3px;border:1px solid var(--edge);background:var(--fill);color:var(--cyan);padding:8px 14px;cursor:pointer;
clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));transition:background .15s,color .15s}
button.b:hover{background:rgba(88,230,255,.2)}
button.b.go{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}button.b.go:hover{background:#9af1ff}
button.b.bad{color:var(--hot)}button.b:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;color:var(--text);background:rgba(7,11,20,.7);border:1px solid var(--edge);padding:8px 10px;min-width:0;border-radius:2px}
input[type=color]{padding:2px;width:46px;height:34px}input[type=range]{padding:0;border:0;background:none;accent-color:var(--cyan);width:100%}
.name{font:600 18px var(--head);letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:#3a4560;flex:none}
dialog{margin:auto;border:1px solid var(--edge);background:#0b111e;color:var(--text);padding:20px;width:min(520px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(3,6,12,.7);backdrop-filter:blur(4px)}
.status{margin:0 4px 14px;padding:12px;border:1px solid var(--edge);font-size:13px;color:var(--sub);line-height:1.7}
.status b{color:var(--text)}.status button{width:100%;margin-top:8px;text-align:center}
.tag{font-size:11px;padding:1px 7px;border:1px solid currentColor;color:var(--amber)}.tag.ok{color:var(--mint)}
.dot.paused{background:var(--violet)}
.dot.live{background:var(--hot);box-shadow:0 0 12px var(--hot);animation:pulse 1.4s infinite}.dot.waiting{background:var(--amber)}
@keyframes pulse{50%{opacity:.35}}
.chart{position:relative;height:64px;display:flex;align-items:flex-end;gap:2px;margin:14px 0 10px}
.chart.tall{height:150px}
.chart i{flex:1;background:linear-gradient(var(--violet),rgba(143,123,255,.25));min-height:2px}
.chart i.hot{background:linear-gradient(var(--hot),var(--violet));box-shadow:0 0 10px var(--hot)}
.chart .thr{position:absolute;left:0;right:0;border-top:1px dashed var(--cyan);opacity:.7}
.sw{position:relative;width:46px;height:24px;border:1px solid var(--edge);background:var(--fill);cursor:pointer;padding:0;flex:none;border-radius:2px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--sub);transition:transform .18s,background .18s}
.sw.on{border-color:var(--mint)}.sw.on::after{transform:translateX(22px);background:var(--mint);box-shadow:0 0 10px var(--mint)}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.clip{padding:0}.clip video,.clip .ph{display:block;width:100%;aspect-ratio:9/16;background:#000;object-fit:cover}
.clip .ph{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;padding:14px}
.clip .meta{padding:10px 12px 12px}.clip .t{font:600 14px var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute!important;top:10px;left:10px;font:700 15px var(--head);padding:2px 9px;background:rgba(7,11,20,.85);border:1px solid currentColor}
.good{color:var(--mint)}.mid{color:var(--cyan)}.low{color:var(--hot)}
.link{all:unset;cursor:pointer;color:var(--cyan);font-size:13px}.link:hover{text-decoration:underline}.link.bad{color:var(--hot)}
.empty{color:var(--sub);padding:40px 0;text-align:center;grid-column:1/-1}
.warn{border-color:var(--amber);color:var(--amber);margin-bottom:14px;font-size:14px}
.log{font:12px/1.65 Consolas,ui-monospace,monospace;color:var(--sub);max-height:200px;overflow:auto;white-space:pre-wrap}
.split{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;align-items:start}
.list button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;width:100%;box-sizing:border-box;border-left:2px solid transparent}
.list button:hover{background:var(--fill)}.list button.on{border-left-color:var(--cyan);background:rgba(88,230,255,.1)}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 38px var(--head)}
.ring span{width:94px;height:94px;border-radius:50%;background:#0b111e;display:grid;place-items:center}
.part{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar{height:8px;background:var(--fill)}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
ul.tips{padding-left:18px;margin:6px 0}ul.tips li{margin:5px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:8px}
.tile b{display:block;font:700 30px var(--head)}
.hbar{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid rgba(127,141,168,.14)}
.field:first-of-type{border-top:0}.field input[type=number]{width:90px;text-align:right}.field input[type=text],.field input[type=password]{width:min(300px,50vw)}
.words{display:flex;flex-wrap:wrap;gap:5px}.words input{width:auto;padding:4px 6px;font-size:13px}.words input.out{opacity:.4}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.styles button{all:unset;cursor:pointer;border:2px solid var(--edge);background:#0b111e;display:block}
.styles button.on{border-color:var(--cyan);box-shadow:0 0 18px rgba(88,230,255,.35)}
.styles img{display:block;width:100%;aspect-ratio:9/16;background:#0b111e;object-fit:cover}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.themes button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--edge);font-size:13px}
.themes button:hover{background:var(--fill)}.themes i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
.styles span{display:block;padding:7px 9px;font:600 14px var(--head)}
video:fullscreen{object-fit:contain!important;aspect-ratio:auto!important;background:#000}
.thumb{position:relative;cursor:pointer}.thumb .play{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:#fff;background:rgba(7,11,20,.25);opacity:0;transition:opacity .15s}
.thumb:hover .play,.thumb:focus-visible .play{opacity:1}
#clipdlg{width:min(980px,96vw);padding:18px}
.viewer{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:20px;align-items:start}
.viewer video{width:100%;max-height:80vh;aspect-ratio:9/16;background:#000;object-fit:contain}
@media(max-width:760px){.viewer{grid-template-columns:1fr}.viewer video{max-height:56vh}}
.words input.cutw{text-decoration:line-through;color:var(--hot);border-color:var(--hot)}
.vwrap{position:relative}.ui{position:absolute;inset:0;pointer-events:none}
.ui div{position:absolute;background:rgba(255,77,157,.38);border:1px dashed var(--hot);font-size:11px;color:#fff;display:grid;place-items:center}
.pubrow{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid rgba(127,141,168,.14)}
.pubrow textarea{width:100%;min-height:62px;resize:vertical;font-size:13px}
.pubrow .ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-size:12px;color:var(--sub)}
.pubrow input[type=number]{width:96px;text-align:right}
@media(max-width:760px){.pubrow{grid-template-columns:1fr}.pubrow .ctl{align-items:flex-start}}
.toast{position:fixed;right:22px;bottom:22px;z-index:5;background:var(--panel);border:1px solid var(--cyan);padding:10px 16px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{flex-direction:row;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--edge)}
.brand,nav .foot,.status{display:none}nav button{border-left:0;white-space:nowrap}main{padding:18px 14px 50px}.split{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<dialog id="chdlg"></dialog>
<dialog id="clipdlg"></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved = ''; try { saved = localStorage.getItem('clipper_view') || ''; } catch {}
let S = null, view = ['monitor','clips','rating','editor','publish','stats','settings'].find(v => v === (location.hash.slice(1) || saved)) || 'channels', sel = null, sig = '', known = null, filt = {ch: '', sort: 'new', rev: ''}, aiBusy = false, addAI = false;
const VIEWS = [['channels', 'Kanały'], ['monitor', 'Monitor'], ['clips', 'Klipy'], ['rating', 'Ocena'], ['editor', 'Edytor'], ['publish', 'Publikacja'], ['stats', 'Statystyki'], ['settings', 'Ustawienia']];

async function post(path, body, quiet) {
  let j = {};
  try { j = await (await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})).json(); }
  catch { j = {error: 'Brak połączenia z aplikacją'}; }
  if (j.error && !quiet) toast(j.error);
  await refresh(true);
  return j;
}
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3200); }
function beep() { try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination);
  o.frequency.setValueAtTime(660, a.currentTime); o.frequency.setValueAtTime(990, a.currentTime + .12); g.gain.setValueAtTime(.12, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .4); o.start(); o.stop(a.currentTime + .4); } catch {} }
const dur = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };
const when = t => new Date(t * 1000).toLocaleString('pl-PL', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
const ready = () => S.clips.filter(c => c.status === 'ready');
const cls = n => n >= 75 ? 'good' : n >= 50 ? 'mid' : 'low';
const total = c => c.score ? c.score.total : null;
const src = c => '/clips/' + encodeURIComponent(c.file || '') + '?v=' + (c.rev || 0);
const clip = id => S.clips.find(c => c.id === id);

function go(v, id) { view = v; try { localStorage.setItem('clipper_view', v); } catch {} if (id) sel = id; sig = ''; drawNav(); draw(true); $('view').scrollTop = 0; }
let updating = '';
async function checkUpdate() {
  updating = 'Sprawdzam…'; drawNav();
  const r = await post('/api/update', {}, true);
  if (r.error) { updating = ''; drawNav(); return toast(r.error); }
  if (!r.updated) { updating = ''; drawNav(); return toast('Masz najnowszą wersję'); }
  updating = 'Instaluję…'; drawNav(); toast('Pobrano aktualizację. Clipper uruchomi się ponownie.');
  const wait = setInterval(async () => { try { const s = await (await fetch('/api/state')).json(); if (s.version !== S.version) { clearInterval(wait); location.reload(); } } catch {} }, 1500);
}
function drawNav() {
  const live = S ? S.channels.filter(c => c.state === 'live').length : 0;
  const last = S && S.clips.find(c => c.status === 'ready');
  $('nav').innerHTML = '<div class="brand"><i></i>Clipper</div>' + (S ? `<div class="status">
      Stan: <b style="color:${S.paused ? 'var(--violet)' : 'var(--mint)'}">${S.paused ? 'wstrzymany' : 'działa'}</b><br>
      Na żywo: <b>${live} z ${S.channels.length}</b><br>W kolejce: <b>${S.queue}</b><br>Ostatni klip: <b>${last ? when(last.created) : 'brak'}</b>
      <button class="b ${S.paused ? 'go' : ''}" onclick="post('/api/pause',{paused:${!S.paused}})">${S.paused ? 'Start' : 'Pauza'}</button></div>` : '') +
    VIEWS.map(([k, t]) => { const n = k === 'channels' ? live : k === 'clips' && S ? ready().filter(c => c.review === 'new').length : 0;
      return `<button class="${k === view ? 'on' : ''}" onclick="go('${k}')">${t}${n ? `<span class="n">${n}</span>` : ''}</button>`; }).join('') +
    `<div class="foot">${S ? 'Wersja ' + esc(S.version) : ''}<button class="b" style="width:100%;margin-top:8px;text-align:center" ${updating ? 'disabled' : ''} onclick="checkUpdate()">${updating || 'Sprawdź aktualizacje'}</button></div>`;
}

/* ---------- widoki ---------- */
function bars(c, n) {
  const h = c.hist.slice(-n), max = Math.max(1, ...h, c.thr || 0) * 1.1;
  return h.map(v => `<i class="${c.thr && v >= c.thr ? 'hot' : ''}" style="height:${v / max * 100}%"></i>`).join('') +
    (c.thr ? `<div class="thr" style="bottom:${c.thr / max * 100}%"></div>` : '');
}
const statusText = c => c.state === 'live' ? `Na żywo od ${dur(S.now - c.live_since)}, nagranie ${c.rec_mb} MB` : c.state === 'waiting' ? 'Offline, czekam na stream' : c.state === 'paused' ? 'Wstrzymany' : 'Wyłączony';
const sw = (on, click, label) => `<button class="sw ${on ? 'on' : ''}" aria-label="${label}" onclick="${click}"></button>`;

function vChannels() {
  const warn = [];
  if (!S.deps.ffmpeg) warn.push('Brak FFmpeg, więc klipy nie powstaną. Zainstaluj: winget install Gyan.FFmpeg i uruchom Clipper ponownie.');
  if (!S.deps.whisper && S.settings.captions) warn.push('Brak faster-whisper, więc klipy będą bez napisów.');
  if (S.deps.caption_error && S.settings.captions) warn.push('Napisy nie zadziałały przy ostatnim klipie: ' + esc(S.deps.caption_error));
  return `<h1>Kanały</h1><p class="lead">Dodaj kanały Twitch. Clipper sam czeka, aż wejdą na żywo, i tnie klip, gdy czat wybuchnie.</p>
  ${warn.map(w => `<div class="card warn">${w}</div>`).join('')}
  <form class="row" style="margin-bottom:16px" onsubmit="event.preventDefault();const i=this.q;if(i.value.trim()){post('/api/channels/add',{name:i.value,ai:addAI});i.value=''}">
    <input name="q" class="grow" placeholder="Nazwa kanału lub link twitch.tv/…" autocomplete="off">${S.deps.ai ? `<label class="row sub" style="gap:6px;cursor:pointer" title="Claude obejrzy klatkę ze streama, tytuł, kategorię i czat, a potem sam ustawi opcje kanału. Wymaga AI ustawionego w Ustawieniach."><input type="checkbox" ${addAI ? 'checked' : ''} onchange="addAI=this.checked" style="accent-color:var(--cyan)">AI dobierze ustawienia</label>` : ''}
    <button class="b go">Dodaj kanał</button></form>
  <div class="grid">${S.channels.map(c => { const last = c.hist.length ? c.hist[c.hist.length - 1] : 0; return `<div class="card">
    <div class="row"><span class="dot ${c.state}"></span><div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${statusText(c)}</div></div>
      ${sw(c.enabled, `post('/api/channels/toggle',{name:'${c.name}',enabled:${!c.enabled}})`, 'Włącz kanał')}</div>
    <div class="chart">${bars(c, 30)}</div>
    ${c.ai.state === 'off' ? '' : `<div class="sub" style="margin-bottom:8px;color:${c.ai.state === 'error' ? 'var(--hot)' : c.ai.state === 'done' ? 'var(--mint)' : 'var(--amber)'}">${
      c.ai.state === 'done' ? 'AI dobrało ustawienia. ' + esc(c.ai.note) : c.ai.state === 'error' ? 'AI nie dobrało ustawień: ' + esc(c.ai.note)
      : c.ai.state === 'working' ? 'AI analizuje kanał…' : 'AI czeka, aż kanał będzie na żywo i zbierze 2 minuty czatu.'}</div>`}
    <div class="row"><div class="sub grow">${c.enabled ? (c.chat ? (c.auto ? `${last} osób pisze, wynik ${c.score.toFixed(1)} z ${c.sens.toFixed(1)}` + (c.thr ? '' : ', uczę się czatu') : `${last} wiad. w oknie` + (c.thr ? `, próg ${Math.round(c.thr)}` : ', zbieram średnią')) : 'Łączę z czatem…') : ''}</div>
      <button class="b" ${c.state === 'live' ? '' : 'disabled'} onclick="post('/api/clip',{name:'${c.name}'})">Klip teraz</button>
      <button class="b" onclick="chOpts('${c.name}')">Opcje</button>
      <button class="link bad" onclick="if(confirm('Usunąć kanał ${c.name}?'))post('/api/channels/remove',{name:'${c.name}'})">Usuń</button></div></div>`; }).join('') ||
    '<div class="empty">Nie obserwujesz jeszcze żadnego kanału. Wpisz nazwę powyżej.</div>'}</div>
  <h2>Dziennik</h2><div class="card log" id="log">${esc(S.logs.map(l => new Date(l[0] * 1000).toLocaleTimeString('pl-PL') + '  ' + l[1]).join('\n') || 'Brak zdarzeń.')}</div>`;
}

const CH_FIELDS = [['hook', 'Haczyk: krótki klip zaczynający się tuż przed akcją'], ['payoff_first', 'Najpierw puenta (2 s zapowiedzi na początku)'], ['auto_zoom', 'Auto-zoom w szczytowym momencie'],
  ['sticker', 'Emotka z czatu jako naklejka'], ['sfx', 'Efekty dźwiękowe (start i szczyt)'], ['facecam', 'Układ z kamerką (kamerka u góry, gra na dole)'], ['title_bar', 'Nagłówek z tytułem klipu'], ['progress', 'Pasek postępu'],
  ['logo', 'Logo / znak wodny'], ['censor', 'Cenzura przekleństw'], ['cut_silence', 'Wycinanie ciszy'], ['highlight', 'Wyróżnianie słów kluczowych'],
  ['loudnorm', 'Wyrównanie głośności'], ['ai_cut', 'AI wybiera najlepszy fragment i tytuł (1 zapytanie na klip)'], ['audio_trigger', 'Klip także przy skoku głośności']];

    <div class="themes">${Object.entries(THEMES).map(([n, c]) => `<button type="button" onclick="setTheme('${n}')">${c.map(x => `<i style="background:${x}"></i>`).join('')}${n}</button>`).join('')}</div>

  <div class="grid big">${FIELDS.map(([title, fs]) => `<div class="card"><h2 style="margin-top:0">${title}</h2>${fs.map(([k, label, type, opt]) => { const v = S.settings[k];
    const ctl = type === 'bool' ? `<button type="button" class="sw ${v ? 'on' : ''}" data-k="${k}" aria-label="${label}" onclick="this.classList.toggle('on')"></button>`
      : type === 'sel' ? `<select data-k="${k}">${opt.map(([a, t]) => `<option value="${a}" ${a === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`
      : type === 'num' ? `<input type="number" min="0" step="${opt}" data-k="${k}" value="${v}">`
      : type === 'color' ? `<input type="color" data-k="${k}" value="${esc(v)}">`
      : `<input type="${type === 'pass' ? 'password' : 'text'}" data-k="${k}" value="${esc(v)}" autocomplete="off">`;
    return `<div class="field" ${DEP[k] ? `data-dep="${DEP[k]}"` : ''}><span>${label}</span>${ctl}</div>`; }).join('')}${title.startsWith('AI') ? '<div id="aibox"></div>' : ''}</div>`).join('')}</div></div>`;
}
async function saveSettings(quiet) {
  const r = await post('/api/settings', collect()); if (!r.error) { aiEdit = false; if (!quiet) toast('Zapisano ustawienia'); draw(true); } return r;
}
async function aiLogin() { if (JSON.stringify(collect()) !== snap) await saveSettings(true); const r = await post('/api/ai/login', {}); if (!r.error) { aiEdit = false; draw(true); } }
async function aiTest() {
  if ($('fields') && JSON.stringify(collect()) !== snap) await saveSettings(true);
  aiTesting = true; applyDeps(); const r = await post('/api/ai/test', {}, true); aiTesting = false; aiEdit = false;
  toast(r.error || 'AI działa'); view === 'settings' ? draw(true) : 0;
}

/* ---------- petla ---------- */
const RENDER = {channels: vChannels, monitor: vMonitor, clips: vClips, rating: vRating, editor: vEditor, publish: vPublish, stats: vStats, settings: vSettings};
const LIVE = {channels: 1, monitor: 1, stats: 1};       // widoki odswiezane co 2 s; pozostale tylko przy zmianie klipow
function draw(force) {
  if (!S) return;
  const s2 = S.clips.map(c => c.id + c.status + (c.rev || 0) + (c.title || '') + (c.ai ? 1 : 0) + (c.review || '')).join();
  if (!force && !LIVE[view] && (s2 === sig || view === 'settings' || view === 'editor' || view === 'publish')) return;
  if (!force && view === 'channels' && document.activeElement && document.activeElement.name === 'q') return;
  sig = s2;
  const log = $('log'), top = log ? log.scrollTop : null;
  $('view').innerHTML = (S.paused ? `<div class="card warn row" style="border-color:var(--violet);color:var(--text)"><span class="grow">Clipper jest wstrzymany. Kanały nie są nagrywane i klipy nie powstają.</span>
    <button class="b go" onclick="post('/api/pause',{paused:false})">Start</button></div>` : '') + RENDER[view]();
  if (view === 'settings') { styleKey = ''; snap = JSON.stringify(collect()); applyDeps(); }
  if ($('log')) $('log').scrollTop = top == null ? 1e6 : top;
  if (view === 'editor') trim();
}
async function refresh(force) {
  try { S = await (await fetch('/api/state')).json(); } catch { return; }
  const ids = new Set(ready().map(c => c.id));
  if (known && S.settings.notify_sound && [...ids].some(i => !known.has(i))) { beep(); toast('Nowy klip jest gotowy'); }
  known = ids; drawNav(); draw(force === true); drawSide(); if (view === 'settings' && force !== true) applyDeps();
}
refresh(true); setInterval(refresh, 2000);
document.addEventListener('pointermove', e => { const c = e.target.closest && e.target.closest('.card'); if (c) { const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', e.clientX - r.left + 'px'); c.style.setProperty('--my', e.clientY - r.top + 'px'); } });

// F11 przelacza pelny ekran okna aplikacji (stan jest zapamietywany)
document.addEventListener('keydown', e => { if (e.key === 'F11') { e.preventDefault(); post('/api/window', {}, true); } });

/* ---------- glosnosc odtwarzacza zapamietana miedzy klipami i uruchomieniami ---------- */
let volTimer = 0;
const setVol = v => { if (S && !v.hasAttribute('muted')) { v.volume = S.settings.player_volume; v.muted = !!S.settings.player_muted; } };
document.addEventListener('loadedmetadata', e => { if (e.target.tagName === 'VIDEO') setVol(e.target); }, true);
document.addEventListener('volumechange', e => { const v = e.target;
  if (v.tagName !== 'VIDEO' || v.hasAttribute('muted') || !S || (v.volume === S.settings.player_volume && v.muted === !!S.settings.player_muted)) return;
  S.settings.player_volume = v.volume; S.settings.player_muted = v.muted; clearTimeout(volTimer);
  volTimer = setTimeout(() => fetch('/api/settings', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({player_volume: v.volume, player_muted: v.muted})}), 400); }, true);

/* ---------- tlo: bonsai z bialych kropek, obraca sie z ruchem myszy ---------- */
(() => {
  const cv = $('bg'), g = cv.getContext('2d');
  let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const P = [], put = (x, y, z, w) => P.push(x, y, z, w || 1);
  const tube = (a, b, c, d, r0, r1, n) => { for (let i = 0; i < n; i++) { const t = rnd(), u = 1 - t, an = rnd() * 6.283, r = (r0 + (r1 - r0) * t) * (.75 + rnd() * .25);
    const x = u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0], y = u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1],
      z = u * u * u * a[2] + 3 * u * u * t * b[2] + 3 * u * t * t * c[2] + t * t * t * d[2]; put(x + Math.cos(an) * r, y + (rnd() - .5) * r * .4, z + Math.sin(an) * r, .8); } };
  const pad = (cx, cy, cz, rx, ry, rz, n) => { for (let i = 0; i < n; i++) { const an = rnd() * 6.283, rr = Math.sqrt(rnd()), up = Math.pow(rnd(), .6);
    put(cx + Math.cos(an) * rr * rx, cy + up * ry * (1 - rr * rr * .7) - rnd() * ry * .15, cz + Math.sin(an) * rr * rz, 1); } };
  // donica
  for (let i = 0; i < 520; i++) { const an = rnd() * 6.283, h = rnd(), r = .62 - h * .1; put(Math.cos(an) * r, -.02 - h * .26, Math.sin(an) * r * .62, .7); }
  for (let i = 0; i < 200; i++) { const an = rnd() * 6.283, r = Math.sqrt(rnd()) * .58; put(Math.cos(an) * r, .0 + (1 - r) * .05, Math.sin(an) * r * .62, .5); }
  // pien w ksztalcie litery S i konary
  tube([-.05, 0, 0], [-.42, .42, .1], [.34, .62, -.12], [.06, 1.08, .02], .13, .05, 620);
  tube([.06, 1.08, .02], [-.05, 1.28, .05], [.1, 1.42, 0], [.02, 1.52, -.02], .05, .02, 150);
  const arms = [[[-.2, .46, .05], [-.6, .5, .2], [-.82, .62, .12], [-.98, .66, .1]], [[.2, .64, -.06], [.55, .66, -.2], [.8, .84, -.12], [.96, .88, -.1]],
    [[.12, .9, 0], [-.2, .98, -.25], [-.45, 1.1, -.3], [-.6, 1.14, -.32]], [[.08, 1.0, .02], [.3, 1.1, .25], [.48, 1.2, .3], [.58, 1.24, .3]]];
  arms.forEach(a => tube(a[0], a[1], a[2], a[3], .045, .015, 150));
  // korona: plaskie "chmury" lisci
  [[-1.0, .68, .1, .42, .2, .34, 620], [.98, .9, -.1, .4, .19, .32, 580], [-.62, 1.16, -.32, .36, .18, .3, 480], [.6, 1.26, .3, .34, .17, .28, 440],
   [.02, 1.52, -.02, .5, .26, .4, 820], [-.3, .98, .25, .26, .13, .22, 260]].forEach(a => pad(...a));
  const N = P.length / 4;
  let W, H, ry = .5, rx = .12, ty = .5, tx = .12, raf = 0;
  function size() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); paint(); }
  function paint() {
    g.clearRect(0, 0, W, H);
    const sc = Math.min(W, H) * .4, ox = W * (W > 760 ? .58 : .5), oy = H * .8, cy = Math.cos(ry), sy = Math.sin(ry), cx = Math.cos(rx), sx = Math.sin(rx);
    for (let i = 0; i < N; i++) { const x = P[i * 4], y = P[i * 4 + 1] - .7, z = P[i * 4 + 2], w = P[i * 4 + 3];
      const X = x * cy + z * sy, Z = -x * sy + z * cy, Y = y * cx - Z * sx, Z2 = y * sx + Z * cx, f = 3.2 / (3.2 + Z2), d = (1.3 - Z2) / 2.6;
      g.fillStyle = `rgba(255,255,255,${(.12 + d * .5) * w})`; const r = (1 + d * 1.6) * f;
      g.fillRect(ox + X * sc * f - r / 2, oy - (Y + .7) * sc * f - r / 2, r, r); }
  }
  function loop() { ry += (ty - ry) * .07; rx += (tx - rx) * .07; paint(); raf = Math.abs(ty - ry) + Math.abs(tx - rx) > .001 ? requestAnimationFrame(loop) : 0; }
  addEventListener('resize', size);
  addEventListener('pointermove', e => { ty = (e.clientX / W - .5) * 3.2; tx = .12 + (e.clientY / H - .5) * .5; if (!raf) raf = requestAnimationFrame(loop); });
  size();
})();
</script>
